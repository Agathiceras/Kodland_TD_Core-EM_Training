<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodland Sparks Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<script>
/* Language: ?lang=xx loads assets/content-xx.js (falls back to English) */
(function(){ var m = /[?&]lang=([a-z]{2}(?:-[A-Za-z]{2})?)/.exec(location.search); window.LANG = m ? m[1] : 'en';
  document.write('<script src="assets/content-' + LANG + '.js"><\/script>'); })();
</script>
<script>if (!window.CONTENT){
  /* The requested language file is missing or has an error: show English, and say so (useful while checking a translation) */
  if (LANG !== 'en') document.addEventListener('DOMContentLoaded', function(){ var b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#E5484D;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 16px;text-align:center';
    b.textContent = '⚠ assets/content-' + LANG + '.js could not be loaded (missing file or an error inside it). Showing English instead.'; document.body.appendChild(b); });
  window.LANG = 'en'; document.write('<script src="assets/content-en.js"><\/script>'); }</script>
<style>
:root{
  --bg:#2b3144; --head:#363d55; --tile:#393f5a; --tile-b:#424a66; --box:#2e3448;
  --lime:#D3FF5F; --blue:#5b8cff; --lbl:#1d2131; --red:#ff4d5e; --txt:#e8eaf1; --muted:#a3a9bd;
  --btn:#3c4360; --btn-on:#4b5377; --kl:#2a2e3d; --kl-head:#383d55;
  --coach:#498BFF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

/* ---------- Classroom header ---------- */
.cr-head{height:56px;background:var(--head);display:flex;align-items:center;padding:0 18px;gap:12px;position:relative}
.cr-head .back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.cr-head .back:hover{background:#4a5274}
.cr-head b{font-size:15px;font-weight:700}
.cr-head .muted{color:var(--muted);font-size:13px}
.hdr-btn{margin-left:auto;background:#262b3c;border:1px solid #545d80;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.hdr-btn:hover{background:#3a4160}
.hdr-btn+.leave{margin-left:18px}
.leave{margin-left:auto;color:var(--red);font-size:13px;display:flex;align-items:center;gap:6px}
.hud{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.hud-chip{background:#262b3c;border:1px solid #545d80;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.hud-chip.mode{background:var(--coach);color:#fff;border-color:var(--coach)}
.heart{font-size:14px;transition:.3s}
.heart.lost{filter:grayscale(1);opacity:.35}
.heart.breaking{animation:heartBreak .8s ease}
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.6)}60%{transform:scale(.6) rotate(-20deg)}100%{transform:scale(1)}}
.dia-pop{animation:diaPop .9s ease}
@keyframes diaPop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---------- Console ---------- */
.console{height:calc(100vh - 56px);padding:16px 14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.room-box{border:1px solid var(--tile-b);border-radius:14px;padding:4px;background:var(--box);position:relative;min-height:0}
.room-box.joined{cursor:pointer}
.room-box.joined:hover{border-color:#6d7799}
.room-inner{height:100%;border-radius:11px;background:var(--tile);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.room-box.joined .room-inner{background:var(--box);align-items:flex-start;justify-content:flex-start}
.tag{position:absolute;top:8px;left:8px;background:var(--lbl);font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;z-index:2;display:flex;align-items:center;gap:6px}
.tag .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}
.av{width:60px;height:60px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:22px;color:#24305a;font-weight:500}
.lbl{position:absolute;left:8px;bottom:8px;background:var(--lbl);font-size:12px;padding:5px 10px;border-radius:5px;display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:2}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.bars i{width:2.5px;background:#3fd16b;border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}
.minis{display:flex;gap:4px;padding:0}
.mini{position:relative;border-radius:9px;background:var(--tile);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mini img{width:100%;height:100%;object-fit:cover}
.console .mini{width:242px;height:148px}
.console .mini .av{width:60px;height:60px}
.console .minis{padding:0}
.side .mini{width:78px;height:64px}
.side .mini .av{width:30px;height:30px;font-size:13px}
.side .mini .lbl{font-size:10px;padding:2px 5px;left:3px;bottom:3px;max-width:70px;overflow:hidden}
.side .room-box.joined .room-inner{padding:2px}
.side .room-box.joined .tag{top:6px;left:6px}

/* ---------- Room layout ---------- */
.room-layout{height:calc(100vh - 56px);display:flex;gap:14px;padding:16px 14px}
.side{width:262px;flex:0 0 262px;display:flex;flex-direction:column;gap:14px}
.side .room-box{flex:1}
.side .av{width:60px;height:60px}
.frame{flex:1;min-width:0;border:2px solid var(--lime);border-radius:14px;padding:6px;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.frame-tag{top:12px;left:12px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.vt{position:relative;background:var(--tile);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;transition:box-shadow .2s}
.vt.student img{height:100%;width:auto;max-width:100%;object-fit:cover;aspect-ratio:16/9}
.vt .dots{position:absolute;top:8px;right:8px;width:28px;height:26px;border-radius:6px;background:var(--lbl);font-size:14px;line-height:1}
.vt.speaking{box-shadow:inset 0 0 0 3px #3fd16b}
.follow-badge{position:absolute;top:8px;left:8px;background:#fff;color:#1d2131;font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;display:flex;gap:5px;align-items:center;z-index:3;animation:fadeIn .4s}
.stage.tasks{flex-direction:row;gap:14px}
.kl{flex:1;min-width:0;background:var(--kl);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.kl-head{height:64px;background:var(--kl-head);display:flex;align-items:center;padding:16px 16px 0;flex:0 0 auto}
.kl-logo{font-family:Unbounded,Inter,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em}
.kl-right{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:14px}
.theme{display:flex;align-items:center;gap:6px;color:#7f87a8}
.theme .sw{width:58px;height:30px;border-radius:999px;background:#2a2f40;position:relative}
.theme .sw::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#7c84b0;top:3px;left:31px}
.lang{border:1px solid #9aa0b5;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600}
.kl-user{display:flex;align-items:center;gap:10px}
.kl-av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#c9d4ff,#6c79c9);border:2px solid #fff}
.kl-body{flex:1;min-height:0;display:flex}
.kl-rail{width:40px;flex:0 0 40px;border-right:1px solid #3d4258;padding-top:10px;display:flex;justify-content:center}
.atom{width:28px;height:28px;border-radius:6px;background:var(--blue);display:grid;place-items:center}
.kl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.kl-title{padding:16px 24px 12px;font-size:15px;font-weight:600}
.task-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 24px;scroll-behavior:smooth}
.task-scroll::-webkit-scrollbar{width:12px}
.task-scroll::-webkit-scrollbar-track{background:#fff;border-radius:2px}
.task-scroll::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:6px;border:3px solid #fff}
.right-col{width:228px;flex:0 0 228px;border:1px solid #3d4460;border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px}
.right-col .vt{flex:0 0 124px}
.right-col .vt .av{width:58px;height:58px}
.right-col .vt.student img{width:100%;height:100%}
.right-col .lbl{font-size:12px}

/* ---------- Toolbar ---------- */
.tb{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:8px 6px 2px;position:relative}
.tb-l,.tb-c{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-btn{white-space:nowrap}
.tb-c{margin:0 auto}
.tb-btn,.tb-ico,.ib,.lead,.nav button{height:40px;border-radius:10px;background:var(--btn);display:flex;align-items:center;gap:8px;font-size:13px;position:relative;transition:background .15s}
.tb-btn{padding:0 14px}
.tb-btn.on{background:var(--btn-on);box-shadow:inset 0 0 0 1px #8a93b8}
.tb-group{display:flex;border-radius:10px;background:var(--btn)}
.tb-group .tb-btn,.tb-group .tb-ico{background:transparent}
.tb-ico{width:42px;justify-content:center}
.tb-group:hover .tb-btn{background:var(--blue);border-radius:10px 0 0 10px}
.tb-group.on{background:var(--btn-on)}
.tb-ico:hover{background:#525b82 !important}
.nav{display:flex;border-radius:10px;background:var(--btn-on);overflow:hidden}
.nav button{width:46px;justify-content:center;background:transparent;border-radius:0}
.nav button:hover{background:#5d6790}
.lead{padding:0 12px 0 14px;cursor:pointer;user-select:none;white-space:nowrap}
.lead .sw{width:34px;height:20px;border-radius:999px;border:2px solid #fff;position:relative;transition:.25s;background:transparent}
.lead .sw::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.25s}
.lead.on .sw{background:var(--blue);border-color:var(--blue)}
.lead.on .sw::after{left:16px}
.lead.flash{animation:leadFlash 1s ease}
@keyframes leadFlash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 4px rgba(91,140,255,.6)}}
.ib{width:40px;justify-content:center}
.ib:hover{background:#4a5274}
.pair{display:flex;border-radius:10px;background:var(--btn)}
.pair .ib{background:transparent}
.pair .ib+.ib{width:36px;border-left:1px solid #2f3550;border-radius:0 10px 10px 0}
.ib.cnt{width:auto;padding:0 14px;gap:12px}
.end{margin-left:auto;height:40px;border-radius:10px;background:var(--btn);color:var(--red);padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;color:#222;font-size:12px;padding:4px 8px;white-space:nowrap;z-index:50;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* ---------- Activity dropdown ---------- */
.dd{position:absolute;left:104px;bottom:62px;width:450px;height:400px;background:#363d55;border:1px solid #9aa0b5;border-radius:8px;z-index:20;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dd-scroll{height:100%;overflow-y:auto;padding:4px}
.dd-item{padding:11px 16px;font-size:14px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dd-item:hover{background:#454d6c}
.dd-item.sel{background:#5a6286}

/* ---------- Activity content (kodland dark) ---------- */
.task{max-width:720px;margin:0 auto;padding:6px 0 60px;font-size:15px;line-height:1.65;color:#e4e6ee}
.task h1{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:33px;line-height:1.2;margin:22px 0 16px}
.task h2{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:23px;margin:26px 0 10px}
.task h3{font-family:Unbounded,Inter,sans-serif;font-weight:700;font-size:19px;margin:20px 0 8px}
.task p{margin:8px 0}
.task ul,.task ol{padding-left:22px;margin:6px 0}
.task li{margin:6px 0}
.task blockquote{border-left:3px solid #8b90a4;margin:16px 0;padding:2px 0 2px 16px;color:#a9aec1}
.banner{width:100%;display:block;border-radius:14px;margin:14px 0}
.media{display:flex;gap:22px;align-items:flex-start;margin:16px 0}
.media-img{flex:0 0 44%;background:#fde9e6;padding:10px;border-radius:16px}
.media.narrow .media-img{flex-basis:25%}
.media-img img{width:100%;display:block;border-radius:10px}
.media-c{flex:1;min-width:0}
.media-c h3{margin-top:4px}
.spoiler{border:1px solid #c5c8d3;border-radius:12px;margin:10px 0;overflow:hidden}
.spoiler summary{list-style:none;padding:12px 16px;font-weight:600;cursor:pointer;display:flex;gap:12px;align-items:center}
.spoiler summary::-webkit-details-marker{display:none}
.spoiler summary::before{content:"▸";font-size:10px;color:#a9aec1;transition:.2s}
.spoiler[open] summary::before{transform:rotate(90deg)}
.spoiler[open] summary{border-bottom:1px solid #c5c8d3}
.sp-body{padding:6px 20px 10px}
.note{background:#353c54;border-left:3px solid var(--blue);border-radius:12px;padding:14px 22px;margin:16px 0}
.note-t{color:#6f97ff;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tnotes{border:1px dashed #a97a26;background:#32333e;border-radius:12px;padding:16px 18px 10px;margin:22px 0}
.tn-label{color:#c98b1e;font-size:13px;margin-bottom:4px}
.tnotes h1{font-size:30px}
.tnotes video{width:100%;border-radius:10px;margin:10px 0;background:#000}
.quiz label{display:flex;gap:12px;align-items:center;border:1px solid #c5c8d3;border-radius:10px;padding:11px 16px;margin:8px 0;cursor:pointer}
.quiz input{width:18px;height:18px;accent-color:#ec5fa6}
.submit{display:block;margin:12px auto;background:#ec5fa6;color:#fff;border:3px solid #fff;border-radius:10px;padding:8px 16px;font-weight:600}
.sim-note{color:#a9aec1;font-style:italic;border:1px dashed #5c6380;border-radius:10px;padding:12px 16px}
.center-img{display:block;max-width:470px;width:100%;margin:12px auto;border-radius:14px}

/* ---------- Simulator layers (guide, decisions, modals) ---------- */
#spot{position:fixed;border-radius:12px;pointer-events:none;z-index:900;box-shadow:0 0 0 9999px rgba(10,12,22,.55);display:none}
#spot::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:3px solid var(--coach);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(73,139,255,.7)}70%{box-shadow:0 0 0 12px rgba(73,139,255,0)}100%{box-shadow:0 0 0 0 rgba(73,139,255,0)}}
#coach{position:fixed;z-index:950;width:350px;background:#fff;color:#1f2433;border-radius:16px;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:none;transition:left .3s,top .3s;border-top:6px solid var(--coach)}
#coach .c-step{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5E7F07}
#coach h4{margin:6px 0 8px;font-size:17px}
#coach p{margin:0;font-size:14px;line-height:1.55;color:#3a4052}
#coach .c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
#coach .c-hint{font-size:12px;color:#5E7F07;font-weight:600}
#coach.shake{animation:shake .4s}
#coach .c-text{font-size:14px;line-height:1.55;color:#3a4052}
#coach.side{width:264px;max-height:calc(100vh - 80px);overflow-y:auto;transition:none}
#coach.side .c-text{font-size:13.5px}
#coach.wide{width:600px}
#coach .btn-p:disabled{background:#c9cdd8;cursor:not-allowed}
.c-check{list-style:none;padding:10px 12px;margin:12px 0 0;background:#f4f6fa;border-radius:10px;font-size:13px}
.c-check li{padding:3px 0 3px 24px;position:relative;color:#5a6075}
.c-check li::before{content:"○";position:absolute;left:4px;color:#a0a6b8;font-weight:700}
.c-check li.ok{color:#1f7a45}
.c-check li.ok::before{content:"✓";color:#1f9d55}
.c-list{margin:12px 0 0;padding-left:20px}
.c-list li{margin:6px 0}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.view{background:#f4f6fa;border-radius:12px;padding:10px}
.vh{font-size:13px;margin-bottom:8px}
.mock{background:#2a2e3d;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;height:118px}
.m-tn{border:1.5px dashed #c98b1e;color:#e8b35a;border-radius:6px;padding:6px 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.m-tn small{font-weight:500;color:#c9a35f}
.mk-c{flex:1;border-radius:6px;background:#3a4160;color:#cfd3e2;font-size:12px;display:grid;place-items:center}
.lead-demo{margin:12px 0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.lead-demo>div{background:#f4f6fa;border-radius:10px;padding:8px 10px 8px 52px;position:relative;line-height:1.45}
.ld-sw{position:absolute;left:10px;top:10px;width:32px;height:18px;border-radius:999px;border:2px solid #8a90a6}
.ld-sw::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#8a90a6;top:2px;left:2px}
.ld-sw.on{background:var(--blue);border-color:var(--blue)}
.ld-sw.on::after{background:#fff;left:16px}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.btn-p{background:#1f2433;color:#fff;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px}
.btn-p:hover{background:#3a4260}
.btn-y{background:var(--lime);color:#14210a;border-radius:12px;padding:13px 26px;font-weight:700;font-size:15px}
.btn-y:hover{filter:brightness(1.05)}

#qp{position:fixed;z-index:800;right:12px;top:66px;width:430px;max-height:calc(100vh - 150px);overflow-y:auto;background:#fff;color:#1f2433;border-radius:18px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;border-top:6px solid var(--coach);animation:fadeIn .35s}
#qp.busy{opacity:.6;pointer-events:none}
#qp.mini .qp-body{display:none}
#qp.mini{width:300px}
.qp-head{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#5E7F07}
.qp-head span+span{margin-left:auto}
.qp-min{width:26px;height:26px;border-radius:7px;background:#f1f3f8;color:#3a4260;font-size:18px;line-height:1;font-weight:700}
.qp-min:hover{background:#e3e7f0}
.qp-body .btn-y{margin-top:4px}
.qp-lock{background:#eaf2ff;color:#1f3d7a;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 6px}
.qp-opt.locked{opacity:.45;cursor:not-allowed}
.qp-replay{margin-top:8px;font-size:13px;font-weight:600;color:#3a4260;border:1px solid #d5d9e5;border-radius:8px;padding:7px 12px}
.qp-replay:hover{background:#f1f3f8}
.qp-open .console{padding-right:456px}
.qp-room #qp{right:256px;width:400px}
.qp-room .notes-tab{right:656px}

/* raised hands, chat notifications, screen share, notes */
.room-box.hand{border-color:#f5a623}
.hand-ico{font-size:13px;margin-left:2px}
.chat-pop{position:absolute;left:8px;bottom:10px;width:min(250px,calc(100% - 16px));background:#3a4160;border-radius:10px;padding:10px 12px;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:fadeIn .3s;cursor:default}
.cp-head{display:flex;gap:10px;align-items:center}
.cp-av{flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.cp-head b{display:block;font-size:13px}
.cp-head small{font-size:11px;color:#a3a9bd}
.cp-x{margin-left:auto;font-size:20px;line-height:1;color:#c8cde0}
.chat-pop p{margin:8px 0 0;font-size:14px}
.share{flex:1;min-width:0;background:#000;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.share video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;background:#000}

.notes-card{width:auto;max-width:92vw;padding:20px 22px 18px;background:#fbf6ee}

.rate{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.rate span{border:1px solid #c5c8d3;border-radius:10px;padding:9px 14px}

.shop{background:#fff7d6;border:1px solid #f1d27a;border-radius:14px;padding:12px 16px;margin:14px 0 6px}
.shop p{margin:2px 0;color:#1f3d7a}
.shop .shop-bal{font-size:13px;color:#7a6420}
.shop.off{background:#f3f4f8;border-color:#dfe2ea}
.shop.off p{color:#7a8094}
.link-btn{font-size:13px;color:#6a7190;text-decoration:underline}
.m-card .btn-y:disabled{background:#e3e5ec;color:#9aa0b5}

#sheet{position:fixed;inset:0;z-index:1200;background:rgba(10,12,22,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:28px 16px;backdrop-filter:blur(3px)}
.sheet-card{width:min(980px,100%);background:#fff;color:#1f2433;border-radius:22px;padding:26px 30px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:popIn .3s ease}

.phase-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.ph-t small{flex-basis:100%;font-weight:500;font-size:12.5px;color:#6a7190}
.ph ol,.ph ul{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.5;color:#3a4052}
.ph li{margin:5px 0}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rules div{background:#eef3ff;border-radius:10px;padding:10px 12px;font-size:14px;color:#2b3354}
.sheet-card .btns{margin-top:18px;display:flex;justify-content:center}
.m-card.recap{text-align:left;width:min(620px,92vw)}
.rc-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5E7F07}
.m-card.recap h2{margin:6px 0 6px}
.rc-steps{list-style:none;padding:0;margin:14px 0 0;counter-reset:rc}
.rc-steps li{counter-increment:rc;display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border-radius:12px;background:#f4f6fa;margin:6px 0;font-size:14px;line-height:1.5;color:#2b3042;opacity:0;animation:rcIn .45s ease forwards}
.rc-steps li::before{content:counter(rc);flex:0 0 24px;height:24px;border-radius:50%;background:#1f2433;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.rc-time{flex:0 0 auto;font-weight:700;color:#3a5bd9;font-size:13px;padding-top:1px}
.rc-now{margin-top:12px;background:#eaf2ff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;color:#1f3d7a;opacity:0;animation:rcIn .45s ease forwards}
@keyframes rcIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m-card{max-height:92vh;overflow-y:auto}
.m-card.recap .btns,.m-card.debrief .btns{justify-content:center}
.m-card.debrief{text-align:left;width:min(760px,94vw)}
.simcode{margin-top:14px;border:2px dashed #2fbf68;background:#eefbf2;border-radius:14px;padding:12px 16px;text-align:center}
.simcode span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1f7a45}
.simcode b{display:block;font-family:Unbounded,Inter,sans-serif;font-size:26px;letter-spacing:.06em;margin:4px 0;color:#1f2433;user-select:all}
.simcode small{color:#5a6075;font-size:13px}
.debrief .rc-steps li{text-align:left}
.debrief .btns .btn-p,.debrief .btns .btn-y{white-space:nowrap}
.debrief h2,.debrief .m-icon,.debrief .m-lives{text-align:center}
.welcome-box{background:rgba(255,255,255,.07);border:1px solid rgba(211,255,95,.22);border-radius:18px;padding:20px 22px;margin:24px 0}
.welcome-box h3{margin:0 0 8px;font-size:17px;color:var(--lime)}
.welcome-box p{margin:6px 0;color:#cfd3e2;line-height:1.65;font-size:15px}
.how{list-style:none;padding:0;margin:10px 0 0;counter-reset:hw;display:grid;gap:10px}
.how li{counter-increment:hw;display:flex;gap:14px;align-items:flex-start;color:#e3e6f0;font-size:15px;line-height:1.55}
.how li::before{content:counter(hw);flex:0 0 30px;height:30px;border-radius:50%;background:var(--lime);color:#1d2131;display:grid;place-items:center;font-weight:800}
.how .btn-ghost{margin-top:6px}
.btn-ghost{border:1px solid #8a93b8;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.sound-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
#soundMsg{font-size:14px;color:#cfd3e2}
.btn-start{font-size:17px;padding:16px 34px;letter-spacing:.02em}
@media (max-width:900px){.phase-row,.rules{grid-template-columns:1fr}}
.phase.locked{opacity:.75}
.qp-q{font-size:15.5px;line-height:1.55;margin:10px 0 14px;font-weight:500}
.qp-opt{width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:2px solid #e2e5ee;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14.5px;color:#1f2433;background:#fafbfd;transition:.15s}
.qp-opt:hover{border-color:var(--blue);background:#f1f5ff}
.qp-opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:#1f2433;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.qp-opt.tried{opacity:.45;pointer-events:none;text-decoration:line-through}

#caption{position:fixed;z-index:850;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(20,23,35,.92);border:1px solid #545d80;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;display:none;max-width:640px;align-items:center;gap:10px;animation:fadeIn .25s}

.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

#modal{position:fixed;inset:0;z-index:1000;background:rgba(10,12,22,.7);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.m-card{width:min(560px,92vw);background:#fff;color:#1f2433;border-radius:22px;padding:30px 32px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:popIn .35s ease}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.m-icon{font-size:52px;line-height:1}

.m-card p{color:#454b5e;font-size:15px;line-height:1.6;margin:8px 0}

.m-card .btns{margin-top:20px;display:flex;gap:10px;justify-content:center}
.m-card.bad{border-top:8px solid var(--red)}
.m-card.good{border-top:8px solid #2fbf68}
.m-card.info{border-top:8px solid var(--coach)}

#intro{position:fixed;inset:0;z-index:1100;background:radial-gradient(1100px 620px at 18% 0%,#2a64c8 0%,#143a74 38%,#0d1a33 78%,#0a1224 100%);display:none;overflow:auto}
.intro-wrap{max-width:900px;margin:0 auto;padding:56px 24px 40px}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}

.fact span{font-size:13px;color:#b9bed0;line-height:1.5}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:30px}

.phase{display:flex;flex-direction:column;align-items:flex-start}

#task{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:960;background:#fff;color:#1f2433;border-radius:14px;border-left:6px solid var(--coach);padding:12px 16px;box-shadow:0 12px 36px rgba(0,0,0,.45);display:none;align-items:center;gap:12px;font-size:14.5px;line-height:1.45;width:max-content;max-width:min(680px,92vw);animation:fadeIn .3s}
#task .t-ico{font-size:20px}
#task .t-back{flex:0 0 auto;font-size:13px;font-weight:600;color:#3a4260;border:1px solid #d5d9e5;border-radius:8px;padding:6px 10px}

#toast{position:fixed;top:140px;left:50%;transform:translateX(-50%);z-index:990;background:#fff;color:#1f2433;font-size:13.5px;font-weight:600;border-radius:999px;padding:9px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;animation:fadeIn .25s}
@media (max-width:900px){.facts{grid-template-columns:1fr 1fr}.phases{grid-template-columns:1fr}}

.sp-h2{font-family:'Source Sans 3',Inter,sans-serif;font-weight:700;font-size:29px;letter-spacing:-.01em;margin:0}
.muted{color:#a6a9b2}

/* feed */
.sp-banner{background:#8b5cf6;color:#fff;border-radius:22px;padding:22px 22px 20px;margin:30px 0 32px;position:relative}
.sp-banner b{font-size:15px}

.pb-in{border:1px solid #f0f0f0;border-radius:999px;height:32px}
.pb-ta{border:1px solid #f0f0f0;border-radius:16px;height:62px}
.pb-hint{color:#b8bbc2;font-size:12px;margin-top:6px}

.pb-drop small{display:block;color:#b0b3ba;margin-top:4px}
.pb-select{border:1px solid #f0f0f0;border-radius:999px;padding:6px 12px;font-size:14px;display:flex;justify-content:space-between}

.pb-badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 6px;margin:10px 0 6px}
.pb-vis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pb-vis div{border:1px solid #f0f0f0;border-radius:16px;padding:14px 12px;font-size:13px}
.pb-vis div.on{border-color:#5b8cff;background:#f2f6ff;color:#3b73f0}
.pb-vis small{display:block;color:#b0b3ba;margin-top:6px;font-size:11.5px}
.pb-tog{border:1px solid #f0f0f0;border-radius:16px;padding:14px 12px;margin-top:10px;display:flex;gap:12px;align-items:center}

.pb-tog div{flex:1;font-size:14px}
.pb-tog small{display:block;color:#b0b3ba;font-size:12px;margin-top:4px}
.sw2{width:46px;height:26px;border-radius:999px;background:#eef0f5;position:relative;flex:0 0 46px}
.sw2::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw2.on{background:#3b82f6}.sw2.on::after{left:23px}
.pb-go{margin-top:20px;background:#8b5cf6;color:#fff;border-radius:999px;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}

/* studio */

.bm{max-width:770px;margin:10px auto 40px;border:1px solid #ececec;border-radius:24px;padding:18px 16px 16px}
.bm h2{font-weight:500;font-size:24px;margin:0;font-family:'Source Sans 3',Inter,sans-serif}
.bm .sub{color:#b8bbc2;font-size:14px;margin:6px 0 16px}

.bm-c small{font-size:12px;margin-top:8px;color:#b8bbc2}
.bm-back{color:#b0b3ba;font-size:14px;cursor:pointer;margin:2px 0 14px;display:inline-block}
.bm-gt{font-weight:600;font-size:13.5px}
.bm-gd{color:#b8bbc2;font-size:12.5px;margin:4px 0 12px}

.bm-p{border:1px solid #f0f0f0;border-radius:999px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14.5px;font-weight:500;cursor:pointer;color:#1d1f27}

.bm-p .ic{color:#a6a9b2;display:flex}
.bm-p.c{justify-content:center}
.bm-p small{display:block;color:#3b73f0;font-size:10.5px;font-weight:500}
.bm-sep{border-top:1px solid #f0f0f0;margin:18px 0}

/* editor shell */

.code{flex:1;min-height:0;display:flex;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:18px;overflow:hidden}

.tutor .bub small{display:block;color:#b8bbc2;font-size:11.5px;margin-top:8px}
.tutor .in{display:flex;gap:8px;padding:10px 10px 12px;border-top:1px solid #f0f0f0}

.term{background:#1e1e1e;flex:1;color:#e8e8e8;font-family:Consolas,monospace;font-size:14px;line-height:1.6;padding:14px 12px}
.runbtn{background:#1d1f27;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center}

.ansrow span{background:#1d1f27;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

/* scratch */
.scr{flex:1;min-height:0;display:flex;gap:10px;background:#e6f0ff;border-radius:14px;padding:8px;border-top:4px solid #ff4d4d}

.scr-code{flex:1;background-color:#fff;background-image:radial-gradient(#dfe3ea 1px,transparent 1px);background-size:18px 18px;position:relative}

.scr-ctrl{display:flex;gap:10px;align-items:center;padding:4px}

.dango{position:absolute;width:60px;height:120px}
.dango i{position:absolute;border-radius:50%}

.dr{flex:1;min-height:0;display:flex;gap:14px}

.swc{width:26px;height:26px;border-radius:50%;border:1px solid #e5e5e5}
.dr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.dr-canvas{flex:1;min-height:0;background:#fafafa;border:1px solid #f0f0f0;border-radius:22px;display:flex;align-items:center;justify-content:center;position:relative}
.px-grid{height:88%;aspect-ratio:1;background:#fff;background-image:linear-gradient(#e2e2e2 1px,transparent 1px),linear-gradient(90deg,#e2e2e2 1px,transparent 1px);background-size:3.125% 3.125%;border:1px solid #ddd;border-radius:6px}

.fr1{width:60px;height:58px;border:2px solid #3b82f6;border-radius:6px;background:#fff;margin:10px 0 8px;position:relative}

.fr-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.ai-side{width:48px;flex:0 0 48px}
.ai-side img{width:46px;height:46px;border-radius:50%;border:2px solid #ee5fa6}

.rw .x{position:absolute;right:20px;top:14px;font-size:22px;cursor:pointer}

.rw-h span{background:#22c55e;border-radius:999px;font-size:11px;padding:4px 10px;box-shadow:0 0 0 3px rgba(34,197,94,.35)}

.rw-dots{display:flex;gap:6px;justify-content:center}
.rw-dots i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.rw-dots i:first-child{background:#22c55e}
.rw-hex{display:flex;gap:8px;justify-content:center;margin:16px 0 50px}

.rw p{font-size:14px;opacity:.85}

function hl(line){
  return esc(line).replace(/(&quot;|"[^"]*"|#.*$|\b(?:import|while|if|elif|else|True|False|break|print|input|int)\b|\b\d+\b)/g, m =>
    m[0] === '"' ? `<span class="s">${m}</span>` : m[0] === '#' ? `<span class="c">${m}</span>` : /\d/.test(m[0]) ? `<span class="n">${m}</span>` : `<span class="k">${m}</span>`);
}
const PY = E.py;
const codePane = (tabs, lines, hi) => `<div class="pane" style="flex:1.1"><div class="tabs2">${tabs.map((t, i) => `<span class="${i === 0 ? 'on' : ''}">${t}</span>`).join('')}</div>

  const t = (n, on) => `<span class="tb2 ${on ? 'on' : ''}">${ic(n, 15)}</span>`, D = E.draw;
  const sw = ['#000','#fff','#0ea5e9','#10b981','#8b5cf6','#ef4444','#ec4899','#d8b4e2','#94a3b8'];

}

      <div class="scr-r"><div class="scr-ctrl"><span style="color:#16a34a;font-size:22px">⚑</span><span style="color:#f59e0b;font-weight:800">❚❚</span><span style="color:#ef4444;font-size:20px">⬣</span></div>
        <div class="scr-stage">${dango('calc(50% - 30px)', 'calc(50% - 70px)', 1)}</div>
        <div class="scr-info">${X.sprite} <span>${X.spriteName}</span> ↔ x <span>0</span> ↕ y <span>0</span> ${X.size} <span>100</span> ${X.direction} <span>90</span></div>
        <div class="scr-sprites"><div class="lst"><div class="sel">${dango('6px', '-22px', .38)}<b>${X.spriteName}</b></div></div><div class="stg">${X.stage}<div style="margin:8px auto 0;width:46px;height:34px;border:1px solid #ddd;border-radius:4px"></div></div></div>
      </div></div>${aiSide()}</div>`;
  } else if (k === 'pixel' || k === 'anim'){
    const an = k === 'anim';
    main = `<div class="ed-main"><div class="dr">${drawTools(an)}<div class="dr-main"><div class="dr-canvas">${an ? '<div class="an-sheet"></div>' : '<div class="px-grid"></div>'}<span class="zoom">${ic('zoomout', 14)} 100% ${ic('zoomin', 14)} ${ic('target', 14)}</span></div>${frames(an)}</div></div>${aiSide()}</div>`;
  } else if (k === 'music'){
    const notes = new Set(['0-8','1-8','3-8','5-8','4-12','8-4','10-11','13-14','15-11','17-13','19-10','20-9','22-13','24-8','25-6','26-7','27-5','28-4','29-6','30-8','32-12','33-11','35-8','36-10','38-9','40-6','41-8','43-11','44-12','46-9','47-7']);
    let cells = '';
    for (let r = 0; r < 16; r++) for (let c = 0; c < 48; c++) cells += `<i class="${notes.has(c + '-' + r) ? 'n' : (Math.floor(c / 4) % 2 ? '' : 'sh')}"></i>`;
    const drow = (col, every, off, hue) => `<div class="mu-drow"><div class="lab"><i style="background:${col}"></i>${ic('speaker', 13)}</div><div class="cells">${Array.from({ length:48 }, (_, c) => `<i class="${(c - off) % every === 0 && c >= off ? '' : (Math.floor(c / 4) % 2 ? '' : 'sh')}" style="${(c - off) % every === 0 && c >= off ? 'background:' + hue : ''}"></i>`).join('')}</div></div>`;
    const Mu = E.music;
    main = `<div class="ed-main"><div class="mu"><div class="mu-top"><span class="mu-pill"><i></i>${Mu.track} ${ic('speaker', 14)}</span><span class="mu-add">${Mu.addTrack}</span><span class="mu-play"><b>▶</b>${Mu.tempo} <i class="slider" style="width:96px"></i><strong>${Mu.bpm}</strong></span></div>
      <div class="mu-grid">${cells}</div>
      <div class="mu-drums"><b style="font-weight:500">${Mu.drums}</b><span class="on">${Mu.electronic}</span><span>${Mu.acoustic}</span><span class="mu-add">${Mu.addTrack}</span></div>
      ${drow('#f43f5e', 4, 0, '#f43f5e')}${drow('#ec4899', 4, 2, '#ec4899')}
    </div>${aiSide()}</div>`;
  } else if (k === 'skin'){
    const t = (n, on) => `<span class="tb2 ${on ? 'on' : ''}">${ic(n, 15)}</span>`;
    const sw = ['#000','#fff','#8b5a2b','#0ea5e9','#10b981','#8b5cf6','#ef4444','#ec4899','#facc15','#94a3b8'], D = E.draw;
    main = `<div class="ed-main"><div class="dr"><div class="dr-tools">
        <h6>${D.draw}</h6><div class="row">${t('pencil')}${t('eraser')}${t('bucket')}${t('picker')}</div>
        <h6>${D.dither}</h6><div class="row">${t('dither')}${t('ditherx')}</div>
        <h6>${D.view}</h6><div class="row">${t('hand', 1)}${t('mirror', 1)}${t('grid', 1)}${t('select', 1)}</div>
        <h6>${D.history}</h6><div class="row">${t('undo')}${t('redo')}</div>
        <div class="row" style="margin-top:14px">${sw.map(c => `<span class="swc" style="background:${c}"></span>`).join('')}</div>
        <h6 style="margin-top:16px">${ic('down', 12)} ${D.exportL}</h6><div class="row"><span class="mu-add">PNG</span><span class="mu-add">MCPACK</span></div>
      </div>
      <div class="sk-view"><div class="sk-tog"><span class="on">${ic('cube', 14)} 3D</span><span>${ic('grid', 14)} ${D.map2d}</span></div>
        <div class="sk-3d"><div class="sk-fig"><i style="left:24px;top:0;width:48px;height:48px"></i><i style="left:24px;top:50px;width:48px;height:72px"></i><i style="left:0;top:50px;width:22px;height:72px"></i><i style="left:74px;top:50px;width:22px;height:72px"></i><i style="left:24px;top:124px;width:23px;height:72px"></i><i style="left:49px;top:124px;width:23px;height:72px"></i></div><span class="zoom">${ic('zoomout', 14)} 100% ${ic('zoomin', 14)}</span></div>
      </div></div></div>`;
  }
  return `<div class="ed">${edBar(k)}${main}</div>`;
}

function aiView(){
  const chip = (i, t) => `<span>${ic(i, 20, 1.6).replace('currentColor', '#10b37c').replace(/stroke="currentColor"/, 'stroke="#10b37c"')}${t}</span>`;
  const H = U.ai;
  return `<div class="ah"><div class="ah-side"><span class="ah-new">${H.newChat}</span><div class="grow"></div>
      <p>${H.keep}</p>
      <span class="ah-mem">${ic('brain', 14)} ${H.memory}</span><div class="ah-bar"></div>
      <small>${H.credits}</small><small>${H.pictures}</small><small>${H.resets}</small></div>
    <div class="ah-main"><div class="ah-top"><img src="${A.aiko}" alt=""><div>${H.name}<small>${H.role}</small></div></div>
      <div class="ah-mid"><div>${H.hello}</div>
        <div class="ah-chips">${chip('game', H.chips[0])}${chip('bug', H.chips[1])}${chip('help', H.chips[2])}${chip('palette', H.chips[3])}</div></div>
      <div class="ah-in">${ic('clip', 18)}<div>${H.ask}</div><span>${ic('send', 15)}</span></div></div></div>`;
}
const CHEST = `<svg width="150" height="130" viewBox="0 0 150 130"><ellipse cx="75" cy="118" rx="52" ry="7" fill="rgba(0,0,0,.15)"/><rect x="22" y="48" width="106" height="62" rx="12" fill="#22d36a"/><rect x="16" y="26" width="118" height="34" rx="14" fill="#3ef07f"/><rect x="58" y="20" width="34" height="9" rx="3" fill="#14a3a3"/><rect x="116" y="56" width="10" height="20" rx="3" fill="#0e7490"/><circle cx="75" cy="70" r="20" fill="#0e7490"/><circle cx="75" cy="70" r="13" fill="#7ff3ff"/><circle cx="75" cy="70" r="7" fill="#e0fdff"/><rect x="26" y="104" width="20" height="14" rx="4" fill="#57534e"/><rect x="104" y="104" width="20" height="14" rx="4" fill="#57534e"/></svg>`;
const rewards = () => `<div class="rw-dim" data-action="closecry"></div><div class="rw"><span class="x" data-action="closecry">×</span>
  <div class="rw-h">${U.rewards.title} <span>${U.rewards.rarity}</span></div><div class="rw-chest">${CHEST}</div>
  <div class="rw-dots"><i></i><i></i><i></i><i></i></div><div class="rw-hex"><i></i><i></i><i></i><i></i></div><p>${U.rewards.hint}</p></div>`;

function viewHTML(){
  switch (S.view){
    case 'feed': return feedView();
    case 'project': return projectView();
    case 'my': return myView();
    case 'publish': return publishView();
    case 'modes': return modesView();
    case 'slots': return slotsView();
    case 'build': return buildView();
    case 'sub': return subView();
    case 'editor': return editorView();
    case 'ai': return aiView();
  }
  return '';
}
let lastView = '';
function render(){
  const key = S.view + (S.sub || '') + (S.ed || '');
  const pg = $('#page'), top = pg && key === lastView ? pg.scrollTop : 0;
  $('#app').innerHTML = header() + `<main id="page">${viewHTML()}</main>` + (S.cry ? rewards() : '');
  $('#page').scrollTop = top;
  lastView = key;
  requestAnimationFrame(placeOverlays);
  setTimeout(placeOverlays, 250);
}

/* =========================================================
   PLATFORM ACTIONS
   ========================================================= */
const TPL = { webjs:'web', webjsb:'web', alien:'web', calcjs:'web', webpy:'web', webpyb:'web', snake:'web', calcpy:'web', termempty:'terminal', guess:'terminal', px16:'pixel', px32:'pixel', px64:'pixel', px128:'pixel', an640:'anim', an960:'anim', an1280:'anim', track:'music', retro:'music', tetris:'music', kpop:'music', steve:'skin', alex:'skin' };
function perform(a, arg){
  switch (a){
    case 'nav':
      if (arg === 'cry'){ S.cry = true; break; }
      S.cry = false; S.view = { feed:'feed', my:'my', publish:'publish', studio:'modes', ai:'ai' }[arg]; break;
    case 'open': S.view = 'project'; break;
    case 'mode': S.view = 'slots'; break;
    case 'slot': S.view = 'build'; break;
    case 'build': if (arg === 'scratch'){ S.view = 'editor'; S.ed = 'scratch'; } else { S.view = 'sub'; S.sub = arg; } break;
    case 'tpl': S.view = 'editor'; S.ed = TPL[arg]; break;
    case 'subback': case 'newproject': S.view = 'build'; break;
    case 'myproj': S.view = 'my'; break;
    case 'closecry': S.cry = false; break;
    default: return false;
  }
  render();
  return true;
}
const goMenu = () => { S.view = 'build'; S.sub = null; };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !$('#app').contains(el)) return;
  const a = el.dataset.action, arg = el.dataset.arg;
  const key = arg !== undefined ? `${a}:${arg}` : a;
  if (S.phase === 'guide'){
    const st = GUIDE[S.step];
    if (st.accept && st.accept.includes(key)){ perform(a, arg); nextGuide(); }
    else nudge();
    return;
  }
  if (S.phase === 'done') perform(a, arg);
});

/* =========================================================
   GUIDED TOUR
   target = element to highlight · accept = the click that moves on · next = a Next button
   after = what the platform does when Next is pressed (e.g. back to the project menu)
   ========================================================= */
// title / text / btn of each step come from CONTENT.steps, in the same order
const GUIDE = [
  { target:'.sp-nav', next:true },
  { target:'#featured', next:true },
  { target:'#card-creeper', accept:['open:creeper'] },
  { target:'.pj-img', next:true },
  { target:'.pj-meta', next:true },
  { target:'.fb-card', next:true },
  { target:'#nav-my', accept:['nav:my'] },
  { target:'#mp-card', next:true },
  { target:'#nav-publish', accept:['nav:publish'] },
  { target:'#pb-types', next:true },
  { target:'#pb-fields', next:true },
  { target:'#pb-vis', next:true },
  { target:'.pb-go', next:true },
  { target:'#nav-studio', accept:['nav:studio'] },
  { target:'.st-mcards', next:true },
  { target:'#mode-creative', accept:['mode:creative'] },
  { target:'#slot-1', accept:['slot:1'] },
  { target:'#bm-web', accept:['build:web'] },
  { target:'#tpl-webjs', accept:['tpl:webjs'] },
  { target:'.ed-left', next:true },
  { target:'.tutor', next:true },
  { target:'.ed-bar', next:true },
  { target:'#btn-new', accept:['newproject'] },
  { target:'#bm-terminal', accept:['build:terminal'] },
  { target:'#tpl-guess', accept:['tpl:guess'] },
  { target:'.ed-left', next:true, after:goMenu },
  { target:'#bm-scratch', accept:['build:scratch'] },
  { target:'.scr', next:true, after:goMenu },
  { target:'#bm-pixel', accept:['build:pixel'] },
  { target:'#tpl-px32', accept:['tpl:px32'] },
  { target:'.dr', next:true, after:goMenu },
  { target:'#bm-anim', accept:['build:anim'] },
  { target:'#tpl-an960', accept:['tpl:an960'] },
  { target:'.dr', next:true, after:goMenu },
  { target:'#bm-music', accept:['build:music'] },
  { target:'#tpl-retro', accept:['tpl:retro'] },
  { target:'.mu', next:true, after:goMenu },
  { target:'#bm-skin', accept:['build:skin'] },
  { target:'#tpl-steve', accept:['tpl:steve'] },
  { target:'.sk-3d', next:true },
  { target:'#nav-ai', accept:['nav:ai'] },
  { target:'.ah-main', next:true },
  { target:'#nav-cry', accept:['nav:cry'] },
  { target:'.rw', next:true, last:true }
].map((s, i) => Object.assign(s, CONTENT.steps[i]));

function startGuide(){
  $('#intro').style.display = 'none';
  S = { phase:'guide', step:0, view:'feed', sub:null, ed:null, cry:false };
  enterStep();
}
function enterStep(){
  render();
  const st = GUIDE[S.step], t = document.querySelector(st.target), pg = $('#page');
  if (t && pg && pg.contains(t)){
    const r = t.getBoundingClientRect(), p = pg.getBoundingClientRect();
    if (r.top < p.top + 10 || r.bottom > p.bottom - 10) pg.scrollTop += r.top - p.top - Math.max(16, (p.height - Math.min(r.height, p.height - 40)) / 2);
  }
  placeOverlays();
}
function nextGuide(){
  const st = GUIDE[S.step];
  if (st.last){ finishGuide(); return; }
  if (st.after) st.after();
  S.step++;
  enterStep();
}
function nudge(){
  const c = $('#coach');
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}

function renderCoach(){
  const coach = $('#coach'), spot = $('#spot');
  if (S.phase !== 'guide'){ coach.style.display = 'none'; spot.style.display = 'none'; return; }
  const st = GUIDE[S.step];
  const foot = st.accept
    ? `<div class="c-foot"><span class="c-hint">${U.coach.hint}</span><span></span></div>`
    : `<div class="c-foot"><span></span><button class="btn-p" id="coachNext">${st.btn || U.coach.next}</button></div>`;
  coach.className = '';
  coach.innerHTML = `<div class="c-step">${U.coach.step(S.step + 1, GUIDE.length)}</div><h4>${st.title}</h4><div class="c-text">${st.text}</div>${foot}`;
  coach.style.display = 'block';
  const nb = $('#coachNext'); if (nb) nb.onclick = nextGuide;

  const t = document.querySelector(st.target);
  let r = null; const pad = 6;
  if (t){
    const b = t.getBoundingClientRect(), pg = $('#page'), p = pg ? pg.getBoundingClientRect() : null;
    // keep the highlight inside the scrolling page when the element is taller than it
    const top = p && pg.contains(t) ? Math.max(b.top, p.top + 4) : b.top, bottom = p && pg.contains(t) ? Math.min(b.bottom, p.bottom - 4) : b.bottom;
    r = { left:b.left, top, width:b.width, height:Math.max(0, bottom - top) };
    Object.assign(spot.style, { display:'block', left:(r.left - pad) + 'px', top:(r.top - pad) + 'px', width:(r.width + pad * 2) + 'px', height:(r.height + pad * 2) + 'px' });
  } else spot.style.display = 'none';

  // Put the card where it covers the least of the highlighted element
  const vw = innerWidth, vh = innerHeight, m = 16;
  coach.style.left = '0px'; coach.style.top = '0px';
  const cw = coach.offsetWidth, ch = coach.offsetHeight;
  const cands = [];
  if (r){
    const cy = r.top + r.height / 2 - ch / 2, cx = r.left + r.width / 2 - cw / 2;
    cands.push([r.left + r.width + m + pad, cy], [r.left - m - pad - cw, cy], [cx, r.top + r.height + m + pad], [cx, r.top - m - pad - ch]);
  }
  cands.push([vw - cw - 16, vh - ch - 16], [16, vh - ch - 16], [vw - cw - 16, 76], [16, 76], [(vw - cw) / 2, vh - ch - 16]);
  let best = null;
  for (const c of cands){
    const x = Math.min(Math.max(8, c[0]), vw - cw - 8), y = Math.min(Math.max(70, c[1]), vh - ch - 8);
    let ov = 0;
    if (r){
      const ox = Math.max(0, Math.min(x + cw, r.left + r.width) - Math.max(x, r.left)), oy = Math.max(0, Math.min(y + ch, r.top + r.height) - Math.max(y, r.top));
      ov = ox * oy;
    }
    if (!best || ov < best.ov) best = { x, y, ov };
    if (ov === 0) break;
  }
  coach.style.left = best.x + 'px'; coach.style.top = best.y + 'px';
}
function placeOverlays(){ renderCoach(); }
window.addEventListener('resize', placeOverlays);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeOverlays);
document.addEventListener('scroll', e => {
  if (S.phase !== 'guide') return;
  if (e.target instanceof Element && e.target.closest('#coach')) return;
  renderCoach();
}, true);

/* =========================================================
   FINISH
   ========================================================= */
// Shown on the final screen; the training asks for it to confirm the tutor completed the guide (keep in sync with the code the training expects)
// New completion code every time the simulation is completed (PREFIX-NNNN-CC). The training validates CC from NNNN — keep p/k/s in sync with CONFIG.CODE_RULES in index.html.
function completionCode(){ const n = 1000 + Math.floor(Math.random() * 9000); return 'SP-' + n + '-' + ((n * 13 + 41) % 89 + 10); }
function modal(html){ const m = $('#modal'); m.innerHTML = html; m.style.display = 'flex'; }
function finishGuide(){
  S.phase = 'done';
  renderCoach();
  const Fi = U.finish, li = (d, i) => `<li style="animation-delay:${d}s"><span>${Fi.items[i]}</span></li>`;
  modal(`<div class="m-card info recap">
    <div class="rc-kicker">${Fi.kicker}</div>
    <h2>${Fi.title}</h2>
    <p>${Fi.intro}</p>
    <ol class="rc-steps">
      ${li('.1', 0)}
      ${li('.4', 1)}
      ${li('.7', 2)}
      ${li('1', 3)}
      ${li('1.3', 4)}
    </ol>
    <div class="simcode"><span>${Fi.codeLabel}</span><b>${completionCode()}</b><small>${Fi.codeHint}</small></div>
    <div class="btns"><button class="btn-y" id="mBack">${Fi.back}</button></div>
    <p id="mBackMsg" style="text-align:center;font-size:13px;margin:10px 0 0"></p></div>`);
  $('#mBack').onclick = backToTraining;
}
// The guide opens from the training: return to that tab. If the browser doesn't allow closing this one, tell the tutor what to do.
function backToTraining(){
  try { if (window.opener && !window.opener.closed) window.opener.focus(); } catch(e){}
  window.close();
  setTimeout(() => { $('#mBackMsg').textContent = U.finish.closeMsg; }, 300);
}

/* =========================================================
   WELCOME PAGE
   ========================================================= */
function showWelcome(){
  const el = $('#intro'), W = U.welcome;
  el.innerHTML = `<div class="intro-wrap">
    <span class="intro-kicker">${W.kicker}</span>
    <h1>${W.title}</h1>
    <p class="lead-p">${W.lead}</p>
    <div class="welcome-box">
      <h3>${W.seeTitle}</h3>
      <ol class="how">
        ${W.see.map(s => `<li><div>${s}</div></li>`).join('\n        ')}
      </ol>
    </div>
    <div class="welcome-box">
      <h3>${W.howTitle}</h3>
      <p>${W.howText}</p>
    </div>
    <button class="btn-y btn-start" id="wStart">${W.start}</button>
  </div>`;
  el.style.display = 'block';
  el.scrollTop = 0;
  $('#wStart').onclick = startGuide;
}

render();
showWelcome();

</script>
